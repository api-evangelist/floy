aid: floy
name: Floy
description: 'Floy is a Munich-based healthcare AI company (founded 2021) that builds
  AI-powered radiology software for medical imaging. Its two products — opportunistic
  screening and diagnostic assistance — analyse CT and MRI examinations to surface
  additional findings beyond the initial radiologist assessment, enabling earlier
  diagnosis and better patient outcomes. The models are trained on 17 million medical
  examinations. Floy is an ISO 13485:2016 certified, EU MDR Class IIb medical-device
  manufacturer and is GDPR compliant, with research partnerships including DKFZ, LMU
  Klinikum Munich, Stanford, and the University of Oxford. It is backed by HV Capital,
  10x Founders, xdeck, and Acurio Ventures. Floy is a clinical B2B product and does
  not publish a public developer API.'
